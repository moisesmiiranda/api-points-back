server:
  port: 8081

spring:
  profiles:
    active: test
  application:
    name: pointsbackapi
  datasource:
    url: jdbc:h2:mem:pointsback;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-key-please-override-in-prod-1234567890}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

admin:
  bootstrap:
    email: ${ADMIN_EMAIL:admin@pointsback.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}

security:
  login-rate-limit:
    max-attempts: 5
    window-minutes: 15

app:
  base-url: http://localhost:5173
  mail:
    provider: log
    from: no-reply@test.local
  password-reset:
    ttl-minutes: 60
    invite-ttl-hours: 72
    max-requests: 5
    window-minutes: 15
